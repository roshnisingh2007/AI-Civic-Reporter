<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Civic Reporter</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">
            AI Civic Reporter
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="report.html">Report Issue</a>
            <a href="track.html">Track Complaint</a>
            <a href="admin.html">Admin Dashboard</a>
            <a href="login.html">Login</a>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="form-section">
        <h1>Admin / Officer Login</h1>
        <p>
            Login to access the AI Civic Reporter management dashboard.
        </p>

        <form id="loginForm">
            <label for="email">Email</label>
            <input type="email" id="email" value="admin@civic.org" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" value="admin123" placeholder="Enter your password" required>

            <button type="submit" class="button" style="width: 100%; margin-top: 20px;">
                Login to Admin Dashboard
            </button>

            <div style="text-align: center; margin-top: 18px;">
                <a href="admin.html" style="color: #1746a2; font-weight: 600; text-decoration: none;">
                    👉 Or Click Here to Directly Open Admin Dashboard
                </a>
            </div>
        </form>
    </section>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();
            // Redirect to admin dashboard
            window.location.href = "admin.html";
        });
    </script>

</body>

</html>
