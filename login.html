<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AI Civic Reporter</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navigation Bar -->

    <nav class="navbar">

        <div class="logo">
            AI Civic Reporter
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="report.html">Report Issue</a>

            <a href="track.html">Track Complaint</a>

            <a href="login.html">Login</a>

        </div>

    </nav>


    <!-- Login Section -->

    <section class="form-section">

        <h1>Login</h1>

        <p>
            Login to access your AI Civic Reporter account.
        </p>


        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="submit"
                class="button">

                Login

            </button>

        </form>

    </section>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                alert("Login successful! This is a frontend prototype.");

            });

    </script>

</body>

</html>
