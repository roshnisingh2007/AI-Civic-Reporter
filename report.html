<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Report an Issue - AI Civic Reporter</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            AI Civic Reporter
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="report.html">Report Issue</a>

            <a href="track.html">Track Complaint</a>

            <a href="login.html">Login</a>

        </div>

    </nav>


    <!-- Report Form -->

    <section class="form-section">

        <h1>Report a Civic Issue</h1>

        <p class="form-intro">
            Help improve your community by reporting
            a civic problem.
        </p>


        <form id="complaintForm">

            <!-- Name -->

            <label for="name">
                Your Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >


            <!-- Category -->

            <label for="category">
                Issue Category
            </label>

            <select id="category" required>

                <option value="">
                    Select an issue
                </option>

                <option value="Garbage">
                    Garbage
                </option>

                <option value="Pothole">
                    Pothole
                </option>

                <option value="Water Leakage">
                    Water Leakage
                </option>

                <option value="Broken Streetlight">
                    Broken Streetlight
                </option>

                <option value="Sanitation">
                    Sanitation
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <!-- Description -->

            <label for="description">
                Describe the Issue
            </label>

            <textarea id="description" placeholder="Describe the problem in detail..." required></textarea>
            
            
            <div id="aiAnalysisPreview" style="
                 display: none;
                 margin: 15px 0;
                 padding: 15px;
                 border-radius: 10px;
                 background: #f0f7ff;
                 border: 1px solid #b8d8ff;
            ">
                 <h3>🤖 AI Analysis Preview</h3>

                 <p><strong>Suggested Category:</strong>
                     <span id="suggestedCategory">-</span>
                 </p>

                 <p><strong>Suggested Priority:</strong>
                     <span id="suggestedPriority">-</span>
                 </p>

                 <p style="font-size: 12px; color: #555;">
                     Demo only — suggestions use simple JavaScript rules,
                     not a real AI model.
                 </p>
            </div>




            <!-- Image -->

            <label for="image">
                Upload Image
            </label>

            <input
                type="file"
                id="image"
                accept="image/*"
            >
            <img
                id="imagePreview"
                alt="Selected complaint photo preview"
                style="display: none; width: 200px; margin-top: 10px; border-radius: 8px;"
            >


            <!-- Location -->

            <label for="location">
                Location
            </label>

            <input
                type="text"
                id="location"
                placeholder="Enter the location of the issue"
                required
            >
            
            <button
                type="button"
                id="getLocationBtn"
                class="button">
               📍 Use My Current Location
            </button>

<p id="locationMessage"></p>



            <!-- Submit -->

            <button
                type="submit"
                class="button">

                Submit Complaint

            </button>

        </form>

    </section>


    <script src="js/script.js"></script>

</body>

</html>
